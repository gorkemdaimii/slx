  <script type="text/babel">
const { useEffect, useMemo, useRef, useState } = React;

/* -------------------- Utils -------------------- */
const TZ = "Europe/Istanbul";

function dayKey(date = new Date()) {
  return date.toLocaleDateString("en-CA", { timeZone: TZ }); // YYYY-MM-DD
}

function hashToIndex(str, mod) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return Math.abs(h) % mod;
}

function niceTime(ts) {
  try {
    const d = ts?.toDate ? ts.toDate() : (ts ? new Date(ts) : null);
    if (!d) return "";
    return d.toLocaleString("tr-TR", { timeZone: TZ, hour: "2-digit", minute: "2-digit" });
  } catch {
    return "";
  }
}

function moodEmoji(v) {
  const n = Number(v);
  if (n <= 10) return "🥲";
  if (n <= 20) return "😞";
  if (n <= 35) return "😕";
  if (n <= 50) return "😐";
  if (n <= 65) return "🙂";
  if (n <= 80) return "😊";
  if (n <= 90) return "😍";
  return "💖";
}

function safeId(s) {
  return encodeURIComponent(String(s || "").trim().toLowerCase());
}

// ✅ Countdown formatter
function formatRemaining(ms) {
  if (ms <= 0) return "şimdi";
  const totalSec = Math.floor(ms / 1000);
  const days = Math.floor(totalSec / 86400);
  const hours = Math.floor((totalSec % 86400) / 3600);
  const mins = Math.floor((totalSec % 3600) / 60);
  const secs = totalSec % 60;

  const parts = [];
  if (days > 0) parts.push(`${days}g`);
  parts.push(`${String(hours).padStart(2, "0")}s`);
  parts.push(`${String(mins).padStart(2, "0")}dk`);
  parts.push(`${String(secs).padStart(2, "0")}sn`);
  return parts.join(" ");
}

/* -------------------- Prompts -------------------- */
const PROMPTS = [
  "Bugün senden duyunca en çok içime su serpecek cümle ne?",
  "Bugün seni düşündüğüm an hangisiydi?",
  "Şu an içimde bir şarkı olsaydı hangisi olurdu?",
  "Bugün kendimle gurur duyduğum şey:",
  "Bugün seni daha çok sevmeme sebep olan şey:",
  "Bugün benden bir şey dileyebilseydin, ne isterdin?",
  "Şu an sarılsak, ilk kim daha sıkı sarılır?",
  "Bugün içimde kalan tek cümle:",
  "Yarın için minik bir söz verelim mi?",
  "Bugün beni en çok ne yordu / ne iyi geldi?",
  "Bu gece birlikte bir sahne çeksek, mekân neresi olurdu?",
  "Bu geceki bölümün adı:",
  "Bugün 'iyi ki' dediğim şey:",
  "Şu an kulağına fısıldamak istediğim:",
  "Bugün romantik bir detay yakaladım:"
];

/* -------------------- Firestore refs (ROOM YOK) -------------------- */
function nightDocRef(db, dKey) {
  return db.collection("slx_nights").doc(dKey);
}
function nightEntriesRef(db, dKey) {
  return nightDocRef(db, dKey).collection("entries");
}
function capsulesRef(db) {
  return db.collection("slx_capsules");
}
function tokensRef(db) {
  return db.collection("slx_notificationTokens");
}

/* -------------------- UI Bits -------------------- */
function Chip({ children, className = "" }) {
  return (
    <span className={"inline-flex items-center rounded-full px-3 py-1 text-xs bg-white/10 border border-white/15 text-white/90 " + className}>
      {children}
    </span>
  );
}

function Button({ children, onClick, disabled, className = "", type = "button" }) {
  return (
    <button
      type={type}
      disabled={disabled}
      onClick={onClick}
      className={
        "rounded-2xl px-4 py-3 font-semibold transition active:scale-[0.99] " +
        (disabled ? "opacity-50 cursor-not-allowed " : "hover:opacity-95 ") +
        "bg-white text-black shadow-lg shadow-black/20 " +
        className
      }
    >
      {children}
    </button>
  );
}

function GhostButton({ children, onClick, className = "" }) {
  return (
    <button
      onClick={onClick}
      className={"rounded-2xl px-4 py-3 font-semibold bg-white/10 text-white border border-white/15 hover:bg-white/15 transition " + className}
    >
      {children}
    </button>
  );
}

function SectionTitle({ title, right }) {
  return (
    <div className="flex items-center justify-between gap-3 mb-3">
      <h2 className="text-white text-lg font-bold tracking-tight">{title}</h2>
      {right}
    </div>
  );
}

function SecretHold({ children }) {
  const [reveal, setReveal] = useState(false);
  return (
    <div
      onMouseDown={() => setReveal(true)}
      onMouseUp={() => setReveal(false)}
      onMouseLeave={() => setReveal(false)}
      onTouchStart={() => setReveal(true)}
      onTouchEnd={() => setReveal(false)}
      className="select-none cursor-pointer"
      style={{ filter: reveal ? "blur(0px)" : "blur(7px)", opacity: reveal ? 1 : 0.7, transition: "all 180ms ease" }}
    >
      {children}
      <div className="mt-2 text-xs text-white/60">{reveal ? "✨ tamam" : "basılı tut → aç"}</div>
    </div>
  );
}

function FilmGrain() {
  return (
    <div
      className="pointer-events-none fixed inset-0 opacity-[0.12] mix-blend-overlay"
      style={{
        backgroundImage:
          "url('data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'160\\' height=\\'160\\'><filter id=\\'n\\'><feTurbulence type=\\'fractalNoise\\' baseFrequency=\\'0.9\\' numOctaves=\\'3\\' stitchTiles=\\'stitch\\'/></filter><rect width=\\'160\\' height=\\'160\\' filter=\\'url(%23n)\\' opacity=\\'0.7\\'/></svg>')",
        animation: "grain 1.8s steps(2) infinite"
      }}
    />
  );
}

/* -------------------- Tonight -------------------- */
function Tonight({ db, me, partner }) {
  const dKey = useMemo(() => dayKey(new Date()), []);
  const [night, setNight] = useState(null);
  const [entries, setEntries] = useState([]);
  const [loading, setLoading] = useState(true);

  const [mood, setMood] = useState(72);
  const [oneLine, setOneLine] = useState("");
  const [text, setText] = useState("");
  const [secret, setSecret] = useState(false);
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState("");

  const prompt = useMemo(() => {
    const idx = hashToIndex(`${dKey}`, PROMPTS.length);
    return { id: idx, text: PROMPTS[idx] };
  }, [dKey]);

  const meKey = safeId(me);

  useEffect(() => {
    setLoading(true);

    const nr = nightDocRef(db, dKey);
    nr.get().then(async (doc) => {
      if (!doc.exists) {
        await nr.set({
          dayKey: dKey,
          prompt,
          createdAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
          complete: false
        });
      }
    }).catch(() => {});

    const unsubNight = nightDocRef(db, dKey).onSnapshot((doc) => {
      setNight(doc.exists ? doc.data() : null);
    });

    const unsubEntries = nightEntriesRef(db, dKey).onSnapshot((snap) => {
      const arr = snap.docs.map((d) => ({ id: d.id, ...d.data(), plainText: d.data()?.text || "" }));
      setEntries(arr);
      setLoading(false);

      const uniqueSenders = new Set(arr.map((x) => x.sender).filter(Boolean));
      if (uniqueSenders.size >= 2) {
        nightDocRef(db, dKey).set({
          complete: true,
          completedAt: firebase.firestore.FieldValue.serverTimestamp(),
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true }).catch(() => {});
      }
    });

    return () => { unsubNight(); unsubEntries(); };
  }, [db, dKey, prompt]);

  const myEntry = useMemo(() => entries.find((e) => safeId(e.sender) === meKey), [entries, meKey]);
  const partnerEntry = useMemo(() => entries.find((e) => partner && safeId(e.sender) === safeId(partner)), [entries, partner]);

  const isComplete = useMemo(() => {
    const uniqueSenders = new Set(entries.map((x) => x.sender).filter(Boolean));
    return uniqueSenders.size >= 2;
  }, [entries]);

  async function saveEntry() {
    setErr("");
    if (!me?.trim()) return setErr("Önce ayarlardan ismini seç 💌");
    if (!text.trim() && !oneLine.trim()) return setErr("Bir şey yazmadan olmaz ya 😅");

    setSaving(true);
    try {
      const ref = nightEntriesRef(db, dKey).doc(meKey || "me");
      const payload = {
        sender: me,
        mood: Number(mood),
        oneLine: oneLine.trim(),
        text: text.trim(),
        secret: !!secret,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        createdAt: myEntry?.createdAt || firebase.firestore.FieldValue.serverTimestamp()
      };

      await ref.set(payload, { merge: true });

      await nightDocRef(db, dKey).set({
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
        prompt
      }, { merge: true });
    } catch (e) {
      console.error(e);
      setErr("Kaydedemedim… Firestore izinlerine bakmak gerek.");
    } finally {
      setSaving(false);
    }
  }

  const title = useMemo(() => night?.prompt?.text || prompt.text, [night, prompt]);

  return (
    <div className="space-y-5">
      <div className="rounded-3xl p-5 border border-white/12 bg-gradient-to-br from-white/10 to-white/5 shadow-2xl shadow-black/30 overflow-hidden">
        <div className="flex items-start justify-between gap-3">
          <div className="min-w-0">
            <div className="text-white/70 text-xs tracking-widest uppercase">Tonight • {dKey}</div>
            <div className="text-white text-2xl font-black leading-tight mt-1">Gece Ritüeli</div>
          </div>
          <Chip className="mt-1 shrink-0">{moodEmoji(mood)} {mood}</Chip>
        </div>

        <div className="mt-4">
          <div className="text-white/70 text-sm mb-2">Bugünün sorusu</div>
          <div className="text-white text-lg font-semibold leading-snug break-words">“{title}”</div>
        </div>

        <div className="mt-5 grid gap-3">
          <label className="text-white/80 text-sm">Mood</label>
          <input type="range" min="0" max="100" value={mood} onChange={(e) => setMood(e.target.value)} className="w-full" />

          <div className="grid gap-2">
            <label className="text-white/80 text-sm">Bugün içimde kalan tek cümle</label>
            <input
              value={oneLine}
              onChange={(e) => setOneLine(e.target.value)}
              placeholder="1 satır… punchline…"
              className="w-full min-w-0 rounded-2xl bg-black/20 border border-white/15 text-white px-4 py-3 outline-none focus:border-white/30"
              maxLength={180}
            />
          </div>

          <div className="grid gap-2">
            <label className="text-white/80 text-sm">Detay</label>
            <textarea
              value={text}
              onChange={(e) => setText(e.target.value)}
              rows={6}
              placeholder="Bugün ne oldu? Neyi hissettin?"
              className="w-full min-w-0 rounded-2xl bg-black/20 border border-white/15 text-white px-4 py-3 outline-none focus:border-white/30 resize-none"
            />
          </div>

          <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
            <label className="text-white/80 text-sm flex items-center gap-2">
              <input type="checkbox" checked={secret} onChange={(e) => setSecret(e.target.checked)} />
              Gizli (basılı tutunca açılsın)
            </label>
            <Button onClick={saveEntry} disabled={saving} className="w-full sm:w-auto">
              {saving ? "Kaydediyorum…" : myEntry ? "Güncelle 💌" : "Gönder 💌"}
            </Button>
          </div>

          {err && <div className="text-rose-200 text-sm mt-1">{err}</div>}
        </div>
      </div>

      <div className="rounded-3xl p-5 border border-white/12 bg-white/5 overflow-hidden">
        <SectionTitle title={isComplete ? "Perde Açıldı 🎬" : "Bekleme Odası"} right={<Chip>{entries.length}/2</Chip>} />
        {loading ? (
          <div className="text-white/70">Yükleniyor…</div>
        ) : (
          <div className="space-y-4">
            <div className="grid sm:grid-cols-2 gap-4">
              <EntryCard who={me} entry={myEntry} mine={true} />
              <EntryCard who={partner || "Partner"} entry={partnerEntry} mine={false} />
            </div>

            {!isComplete && (
              <div className="text-white/70 text-sm">
                İkisi de yazınca otomatik açılacak. <span className="text-white/90 font-semibold">Bu geceyi birlikte tamamlıyoruz.</span>
              </div>
            )}

            {isComplete && <RevealSplit entries={entries} me={me} />}
          </div>
        )}
      </div>
    </div>
  );
}

function EntryCard({ who, entry, mine }) {
  const has = !!entry;
  const mood = entry?.mood ?? null;
  const oneLine = entry?.oneLine || "";
  const body = entry?.plainText || entry?.text || "";
  const secret = !!entry?.secret;

  return (
    <div className={"rounded-3xl p-4 border shadow-xl shadow-black/25 overflow-hidden " + (has ? "bg-gradient-to-br from-white/10 to-white/5 border-white/15" : "bg-black/15 border-white/10")}>
      <div className="flex items-center justify-between gap-2">
        <div className="text-white font-bold min-w-0 break-words">{who || (mine ? "Ben" : "O")}</div>
        {has && <Chip className="shrink-0">{moodEmoji(mood)} {mood}</Chip>}
      </div>

      {!has ? (
        <div className="mt-4 text-white/60 text-sm">{mine ? "Senin girişin burada görünecek." : "Onun yazması bekleniyor…"}</div>
      ) : (
        <div className="mt-3 space-y-3">
          {oneLine && <div className="text-white text-base font-semibold leading-snug break-words">“{oneLine}”</div>}
          <div className="text-white/80 text-sm whitespace-pre-wrap leading-relaxed break-words overflow-hidden">
            {secret ? <SecretHold>{body}</SecretHold> : body}
          </div>
          <div className="text-white/50 text-xs">{entry?.updatedAt ? `${niceTime(entry.updatedAt)}` : ""}</div>
        </div>
      )}
    </div>
  );
}

function RevealSplit({ entries, me }) {
  const ordered = useMemo(() => {
    const arr = [...entries];
    arr.sort((a, b) => {
      const aMe = safeId(a.sender) === safeId(me);
      const bMe = safeId(b.sender) === safeId(me);
      if (aMe && !bMe) return -1;
      if (!aMe && bMe) return 1;
      return 0;
    });
    return arr.slice(0, 2);
  }, [entries, me]);

  const [show, setShow] = useState(false);
  useEffect(() => {
    const t = setTimeout(() => setShow(true), 200);
    return () => clearTimeout(t);
  }, []);

  return (
    <div className="mt-2">
      <div
        className={
          "rounded-3xl p-5 border border-white/12 bg-gradient-to-br from-black/35 to-black/15 overflow-hidden " +
          (show ? "opacity-100 translate-y-0" : "opacity-0 translate-y-2")
        }
        style={{ transition: "all 500ms ease" }}
      >
        <div className="text-white/60 text-xs tracking-widest uppercase">title card</div>
        <div className="text-white text-2xl font-black mt-1">“İkinizin Gecesi”</div>
        <div className="text-white/70 text-sm mt-1">split screen • {dayKey(new Date())}</div>

        <div className="mt-5 grid sm:grid-cols-2 gap-4">
          {ordered.map((e) => (
            <div key={e.id} className="rounded-3xl p-4 bg-white/5 border border-white/10 overflow-hidden">
              <div className="flex items-center justify-between">
                <div className="text-white font-bold min-w-0 break-words">{e.sender}</div>
                <Chip className="shrink-0">{moodEmoji(e.mood)} {e.mood}</Chip>
              </div>
              {e.oneLine && <div className="mt-3 text-white text-base font-semibold break-words">“{e.oneLine}”</div>}
              <div className="mt-3 text-white/80 text-sm whitespace-pre-wrap leading-relaxed break-words overflow-hidden">
                {e.secret ? <SecretHold>{e.text}</SecretHold> : e.text}
              </div>
            </div>
          ))}
        </div>

        <div className="mt-4 text-white/70 text-sm">Bu gece tamam. Yarın yine. 💞</div>
      </div>
    </div>
  );
}

/* -------------------- Archive -------------------- */
function Archive({ db }) {
  const [nights, setNights] = useState([]);
  const [selectedDay, setSelectedDay] = useState(null);
  const [selectedEntries, setSelectedEntries] = useState([]);
  const [monthOffset, setMonthOffset] = useState(0);

  useEffect(() => {
    const unsub = db.collection("slx_nights").orderBy("dayKey", "desc").limit(180).onSnapshot((snap) => {
      setNights(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
    });
    return () => unsub();
  }, [db]);

  useEffect(() => {
    if (!selectedDay) return;
    const unsub = nightEntriesRef(db, selectedDay).onSnapshot((snap) => {
      const arr = snap.docs.map((d) => ({ id: d.id, ...d.data(), plainText: d.data()?.text || "" }));
      setSelectedEntries(arr);
    });
    return () => unsub();
  }, [db, selectedDay]);

  const todayKey = useMemo(() => dayKey(new Date()), []);
  const nowMidnight = useMemo(() => {
    const d = new Date(new Date().toLocaleString("en-US", { timeZone: TZ }));
    d.setHours(0, 0, 0, 0);
    return d;
  }, []);

  const activeMonth = useMemo(() => {
    const d = new Date(nowMidnight);
    d.setMonth(d.getMonth() + monthOffset);
    d.setDate(1);
    return d;
  }, [nowMidnight, monthOffset]);

  const monthLabel = useMemo(
    () => activeMonth.toLocaleDateString("tr-TR", { timeZone: TZ, year: "numeric", month: "long" }),
    [activeMonth]
  );

  const monthDays = useMemo(() => {
    const d = new Date(activeMonth);
    const firstDayWeek = new Date(d).getDay(); // 0 Sun
    const offset = (firstDayWeek + 6) % 7; // monday=0
    const start = new Date(d);
    start.setDate(1 - offset);
    const cells = [];
    for (let i = 0; i < 42; i++) {
      const cell = new Date(start);
      cell.setDate(start.getDate() + i);
      const key = cell.toLocaleDateString("en-CA", { timeZone: TZ });
      cells.push({ date: cell, key, inMonth: cell.getMonth() === activeMonth.getMonth() });
    }
    return cells;
  }, [activeMonth]);

  const completedSet = useMemo(() => new Set(nights.filter((n) => n.complete).map((n) => n.dayKey || n.id)), [nights]);
  const anySet = useMemo(() => new Set(nights.map((n) => n.dayKey || n.id)), [nights]);

  const streak = useMemo(() => {
    const set = completedSet;
    let count = 0;
    const d = new Date(nowMidnight);
    for (let i = 0; i < 365; i++) {
      const key = d.toLocaleDateString("en-CA", { timeZone: TZ });
      if (set.has(key)) { count++; d.setDate(d.getDate() - 1); }
      else break;
    }
    return count;
  }, [completedSet, nowMidnight]);

  const selectedNight = useMemo(() => nights.find((n) => (n.dayKey || n.id) === selectedDay), [nights, selectedDay]);

  return (
    <div className="space-y-5">
      <div className="rounded-3xl p-5 border border-white/12 bg-white/5 overflow-hidden">
        <SectionTitle
          title="Arşiv"
          right={
            <div className="flex items-center gap-2">
              <GhostButton onClick={() => setMonthOffset((m) => m - 1)}>←</GhostButton>
              <GhostButton onClick={() => setMonthOffset(0)}>Bugün</GhostButton>
              <GhostButton onClick={() => setMonthOffset((m) => m + 1)}>→</GhostButton>
            </div>
          }
        />
        <div className="text-white/80 font-semibold mb-3">{monthLabel}</div>

        <div className="grid grid-cols-7 gap-2 text-xs text-white/60 mb-2">
          {["Pzt", "Sal", "Çar", "Per", "Cum", "Cmt", "Paz"].map((d) => (
            <div key={d} className="text-center">{d}</div>
          ))}
        </div>

        <div className="grid grid-cols-7 gap-2">
          {monthDays.map((c) => {
            const isToday = c.key === todayKey;
            const has = anySet.has(c.key);
            const done = completedSet.has(c.key);
            return (
              <button
                key={c.key}
                onClick={() => has && setSelectedDay(c.key)}
                className={
                  "aspect-square rounded-2xl border text-center flex items-center justify-center relative " +
                  (c.inMonth ? "text-white/90 " : "text-white/35 ") +
                  (has ? "bg-white/10 border-white/15 hover:bg-white/15 " : "bg-black/10 border-white/10 ") +
                  (isToday ? "ring-2 ring-rose-300/70 " : "")
                }
                title={has ? "Aç" : ""}
              >
                <span className="text-sm font-semibold">{c.date.getDate()}</span>
                {done && <span className="absolute bottom-2 w-2 h-2 rounded-full bg-rose-200"></span>}
              </button>
            );
          })}
        </div>

        <div className="mt-4 flex items-center justify-between">
          <Chip>🔥 streak: <span className="ml-1 font-bold">{streak}</span></Chip>
          <Chip>✅ toplam gece: <span className="ml-1 font-bold">{nights.filter((n) => n.complete).length}</span></Chip>
        </div>
      </div>

      {selectedDay && (
        <div className="rounded-3xl p-5 border border-white/12 bg-white/5 overflow-hidden">
          <SectionTitle title={selectedDay} right={<GhostButton onClick={() => setSelectedDay(null)}>Kapat</GhostButton>} />
          {selectedNight?.prompt?.text && <div className="text-white/70 text-sm mb-3 break-words">Soru: “{selectedNight.prompt.text}”</div>}

          <div className="grid sm:grid-cols-2 gap-4">
            {selectedEntries.map((e) => (
              <div key={e.id} className="rounded-3xl p-4 bg-black/15 border border-white/10 overflow-hidden">
                <div className="flex items-center justify-between">
                  <div className="text-white font-bold min-w-0 break-words">{e.sender}</div>
                  <Chip className="shrink-0">{moodEmoji(e.mood)} {e.mood}</Chip>
                </div>
                {e.oneLine && <div className="mt-3 text-white text-base font-semibold break-words">“{e.oneLine}”</div>}
                <div className="mt-3 text-white/80 text-sm whitespace-pre-wrap leading-relaxed break-words overflow-hidden">
                  {e.secret ? <SecretHold>{e.text}</SecretHold> : e.text}
                </div>
              </div>
            ))}
            {selectedEntries.length === 0 && <div className="text-white/60">Bu gece boş ya da erişim yok.</div>}
          </div>
        </div>
      )}
    </div>
  );
}

/* -------------------- Capsules (COUNTDOWN + CINEMATIC) -------------------- */
function CapsuleCinematicModal({ capsule, mode, onClose }) {
  const [stage, setStage] = useState("boot");
  const openMs = capsule?.openAt?.toDate ? capsule.openAt.toDate().getTime() : null;

  useEffect(() => {
    const t1 = setTimeout(() => setStage("title"), 50);
    const t2 = setTimeout(() => setStage("reveal"), 1050);
    return () => { clearTimeout(t1); clearTimeout(t2); };
  }, []);

  const subtitle = mode === "auto" ? "Kapsül kendi kendine açıldı" : "Projector mode: ON";

  return (
    <div className="fixed inset-0 z-50">
      <div className="absolute inset-0 bg-black/80 backdrop-blur-sm" onClick={onClose} />
      <div className="absolute top-0 left-0 right-0 h-10 bg-black/90" />
      <div className="absolute bottom-0 left-0 right-0 h-12 bg-black/90" />

      <div className="absolute inset-0 flex items-center justify-center px-4">
        <div className="w-full max-w-xl relative">
          <div
            className={
              "rounded-3xl border border-white/12 bg-gradient-to-br from-white/10 to-white/5 shadow-2xl shadow-black/40 overflow-hidden " +
              (stage === "boot" ? "opacity-0 translate-y-2" : "opacity-100 translate-y-0")
            }
            style={{ transition: "all 420ms ease" }}
          >
            <div className="px-5 pt-5">
              <div className="text-white/60 text-xs tracking-widest uppercase">title card</div>
              <div className="text-white text-2xl font-black mt-1">
                {stage !== "reveal" ? "KAPSÜL AÇILIYOR" : "KAPSÜL AÇILDI"}
              </div>
              <div className="text-white/70 text-sm mt-1">{subtitle}</div>
            </div>

            <div className="px-5 pb-5 pt-4">
              {stage !== "reveal" ? (
                <div className="rounded-3xl bg-black/25 border border-white/10 p-4">
                  <div className="text-white/60 text-xs tracking-widest uppercase">loading</div>
                  <div className="mt-2 h-2 rounded-full bg-white/10 overflow-hidden">
                    <div
                      className="h-2 bg-white"
                      style={{
                        width: stage === "title" ? "70%" : "20%",
                        transition: "width 900ms ease"
                      }}
                    />
                  </div>
                  <div className="text-white/60 text-xs mt-3 break-words">
                    {capsule?.sender ? `from: ${capsule.sender}` : ""}{" "}
                    {openMs ? `• ${new Date(openMs).toLocaleString("tr-TR", { timeZone: TZ })}` : ""}
                  </div>
                </div>
              ) : (
                <div className="rounded-3xl bg-black/25 border border-white/10 p-4 overflow-hidden">
                  <div className="flex items-center justify-between gap-3">
                    <Chip className="min-w-0">💌 <span className="break-words">{capsule?.sender || "?"}</span></Chip>
                    <Chip className="shrink-0">🕰️ {openMs ? new Date(openMs).toLocaleString("tr-TR", { timeZone: TZ, hour: "2-digit", minute: "2-digit" }) : ""}</Chip>
                  </div>
                  <div className="mt-4 text-white text-base whitespace-pre-wrap leading-relaxed break-words overflow-hidden">
                    {capsule?.text || ""}
                  </div>
                </div>
              )}

              <div className="mt-4 flex items-center justify-between">
                <div className="text-white/50 text-xs">press close to fade out</div>
                <Button onClick={onClose}>Kapat</Button>
              </div>
            </div>
          </div>

          <div className="absolute -inset-6 rounded-[2.5rem] bg-[radial-gradient(circle_at_top,rgba(244,143,177,0.22),transparent_60%)] blur-2xl pointer-events-none" />
        </div>
      </div>
    </div>
  );
}

function Capsules({ db, me }) {
  const [items, setItems] = useState([]);
  const [text, setText] = useState("");
  const [openAt, setOpenAt] = useState("");
  const [saving, setSaving] = useState(false);
  const [err, setErr] = useState("");

  const [nowMs, setNowMs] = useState(Date.now());
  const [modal, setModal] = useState({ open: false, capsule: null, mode: "manual" });

  const prevOpenMap = useRef({});
  const autoOpened = useRef(new Set());

  useEffect(() => {
    const t = setInterval(() => setNowMs(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);

  useEffect(() => {
    const unsub = capsulesRef(db).orderBy("openAt", "desc").limit(120).onSnapshot((snap) => {
      const arr = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      setItems(arr);
    });
    return () => unsub();
  }, [db]);

  async function addCapsule() {
    setErr("");
    if (!me?.trim()) return setErr("Ayarlardan ismini seç.");
    if (!text.trim()) return setErr("Kapsül boş olmaz 😅");
    if (!openAt) return setErr("Açılma tarihi seç.");

    const d = new Date(openAt);
    if (Number.isNaN(d.getTime())) return setErr("Tarih hatalı.");
    if (d.getTime() < Date.now()) return setErr("Geçmiş tarih olmaz.");

    setSaving(true);
    try {
      await capsulesRef(db).add({
        sender: me,
        openAt: firebase.firestore.Timestamp.fromDate(d),
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        text: text.trim()
      });
      setText("");
      setOpenAt("");
    } catch (e) {
      console.error(e);
      setErr("Kaydedemedim.");
    } finally {
      setSaving(false);
    }
  }

  function openCinematic(capsule, mode = "manual") {
    setModal({ open: true, capsule, mode });
  }
  function closeCinematic() {
    setModal({ open: false, capsule: null, mode: "manual" });
  }

  useEffect(() => {
    for (const c of items) {
      const openTime = c.openAt?.toDate ? c.openAt.toDate().getTime() : null;
      if (!openTime) continue;

      const isOpen = openTime <= nowMs;
      const prev = prevOpenMap.current[c.id];
      prevOpenMap.current[c.id] = isOpen;

      if (prev === false && isOpen === true && !autoOpened.current.has(c.id)) {
        autoOpened.current.add(c.id);
        openCinematic(c, "auto");
      }
      if (prev === undefined) prevOpenMap.current[c.id] = isOpen;
    }
  }, [items, nowMs]);

  return (
    <div className="space-y-5">
      {modal.open && (
        <CapsuleCinematicModal capsule={modal.capsule} mode={modal.mode} onClose={closeCinematic} />
      )}

      <div className="rounded-3xl p-5 border border-white/12 bg-white/5 overflow-hidden">
        <SectionTitle title="Zaman Kapsülleri" />
        <div className="grid gap-3">
          <textarea
            value={text}
            onChange={(e) => setText(e.target.value)}
            rows={4}
            placeholder="Geleceğe bir mektup…"
            className="w-full min-w-0 rounded-2xl bg-black/20 border border-white/15 text-white px-4 py-3 outline-none focus:border-white/30 resize-none"
          />
          <div className="grid grid-cols-1 sm:grid-cols-[1fr_auto] gap-3">
            <input
              type="datetime-local"
              value={openAt}
              onChange={(e) => setOpenAt(e.target.value)}
              className="w-full min-w-0 rounded-2xl bg-black/20 border border-white/15 text-white px-4 py-3 outline-none focus:border-white/30"
            />
            <Button onClick={addCapsule} disabled={saving} className="w-full sm:w-auto">
              {saving ? "Gönderiyorum…" : "Kapsüle koy 💌"}
            </Button>
          </div>
          {err && <div className="text-rose-200 text-sm">{err}</div>}
        </div>
      </div>

      <div className="rounded-3xl p-5 border border-white/12 bg-white/5 overflow-hidden">
        <SectionTitle title="Kapsül Rafı" right={<Chip>{items.length}</Chip>} />
        <div className="grid gap-3">
          {items.map((c) => {
            const openMs = c.openAt?.toDate ? c.openAt.toDate().getTime() : null;
            const isOpen = openMs ? openMs <= nowMs : false;
            const remain = openMs ? openMs - nowMs : null;

            return (
              <div key={c.id} className="rounded-3xl p-4 bg-black/15 border border-white/10 overflow-hidden">
                <div className="flex items-center justify-between gap-2">
                  <div className="text-white font-bold min-w-0 break-words">{c.sender || "?"}</div>
                  <Chip className="shrink-0">{isOpen ? "🔓 açık" : "🔒 kilitli"}</Chip>
                </div>

                <div className="text-white/60 text-xs mt-1 break-words">
                  Açılma: {openMs ? new Date(openMs).toLocaleString("tr-TR", { timeZone: TZ }) : ""}
                </div>

                {!isOpen && (
                  <div className="mt-3 rounded-2xl border border-white/10 bg-white/5 p-3 overflow-hidden">
                    <div className="text-white/70 text-xs tracking-widest uppercase">countdown</div>
                    <div className="text-white text-lg font-black mt-1">{formatRemaining(remain || 0)}</div>
                    <div className="text-white/60 text-xs mt-1">Açılınca otomatik “title card” 🎬</div>
                  </div>
                )}

                <div className="mt-3 text-white/80 text-sm whitespace-pre-wrap leading-relaxed break-words overflow-hidden">
                  {isOpen ? c.text : <div className="text-white/60">Bu kapsül kilitli.</div>}
                </div>

                <div className="mt-4 flex justify-end">
                  {isOpen ? (
                    <GhostButton onClick={() => openCinematic(c, "manual")}>Aç 🎬</GhostButton>
                  ) : (
                    <GhostButton onClick={() => {}} className="opacity-60 cursor-not-allowed">Kilitli</GhostButton>
                  )}
                </div>
              </div>
            );
          })}

          {items.length === 0 && <div className="text-white/60">Henüz kapsül yok.</div>}
        </div>
      </div>
    </div>
  );
}

/* -------------------- Settings -------------------- */
function Settings({ db, me, setMe, partner, setPartner, vapidKey, setVapidKey }) {
  const [msg, setMsg] = useState("");

  useEffect(() => localStorage.setItem("slx_me", me || ""), [me]);
  useEffect(() => localStorage.setItem("slx_partner", partner || ""), [partner]);
  useEffect(() => localStorage.setItem("slx_vapid", vapidKey || ""), [vapidKey]);

  async function subscribePush() {
    try {
      if (!("Notification" in window)) { setMsg("Tarayıcı bildirim desteklemiyor."); return; }
      const perm = await Notification.requestPermission();
      if (perm !== "granted") { setMsg("Bildirim izni yok."); return; }
      if (!messaging) { setMsg("Push bu cihazda desteklenmiyor (messaging yok)."); return; }
      if (!vapidKey) { setMsg("VAPID key lazım (Firebase Console → Cloud Messaging)."); return; }

      const token = await messaging.getToken({ vapidKey });
      if (!token) { setMsg("Token alınamadı."); return; }

      await tokensRef(db).doc(token).set({
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        ua: navigator.userAgent.slice(0, 180)
      });

      setMsg("Bildirim kayıt edildi 💌");
      setTimeout(() => setMsg(""), 2200);
    } catch (e) {
      console.error(e);
      setMsg("Bildirim kaydı patladı. Console'a bak.");
    }
  }

  return (
    <div className="space-y-5">
      <div className="rounded-3xl p-5 border border-white/12 bg-white/5 overflow-hidden">
        <SectionTitle title="Ayarlar" />
        <div className="grid gap-3">
          <div className="grid sm:grid-cols-2 gap-3">
            <div className="grid gap-2">
              <label className="text-white/80 text-sm">Ben</label>
              <input
                value={me}
                onChange={(e) => setMe(e.target.value)}
                placeholder="İsmin"
                className="w-full min-w-0 rounded-2xl bg-black/20 border border-white/15 text-white px-4 py-3 outline-none focus:border-white/30"
              />
            </div>
            <div className="grid gap-2">
              <label className="text-white/80 text-sm">Partner</label>
              <input
                value={partner}
                onChange={(e) => setPartner(e.target.value)}
                placeholder="Onun ismi"
                className="w-full min-w-0 rounded-2xl bg-black/20 border border-white/15 text-white px-4 py-3 outline-none focus:border-white/30"
              />
            </div>
          </div>

          <div className="rounded-3xl p-4 bg-black/15 border border-white/10 overflow-hidden">
            <div className="text-white font-bold">Push (opsiyonel)</div>
            <div className="text-white/60 text-xs mt-1">Web push göndermek için server-side / Cloud Function gerekir. Burada sadece token kaydı var.</div>
            <div className="mt-3 grid gap-2">
              <label className="text-white/80 text-sm">VAPID Key</label>
              <input
                value={vapidKey}
                onChange={(e) => setVapidKey(e.target.value)}
                placeholder="Firebase Console → Cloud Messaging → Web configuration"
                className="w-full min-w-0 rounded-2xl bg-black/20 border border-white/15 text-white px-4 py-3 outline-none focus:border-white/30"
              />
              <div className="flex items-center gap-3">
                <GhostButton onClick={subscribePush}>Bildirimleri aç</GhostButton>
              </div>
            </div>
          </div>

          {msg && <div className="text-rose-200 text-sm">{msg}</div>}
        </div>
      </div>
    </div>
  );
}

/* -------------------- Duvar (Legacy) — MOBİL FIX ✅ -------------------- */
function LegacyWall() {
  const [messages, setMessages] = useState([]);
  const [newMessage, setNewMessage] = useState("");
  const [senderName, setSenderName] = useState("");
  const [secretMode, setSecretMode] = useState(false);
  const [capsuleDate, setCapsuleDate] = useState("");
  const [sending, setSending] = useState(false);

  const now = new Date();

  useEffect(() => {
    const unsub = db.collection("messages").orderBy("timestamp", "desc").onSnapshot((snapshot) => {
      setMessages(snapshot.docs.map((doc) => ({ id: doc.id, ...doc.data() })));
    });
    return () => unsub();
  }, []);

  async function send() {
    if (!senderName.trim() || !newMessage.trim()) return;
    setSending(true);
    try {
      await db.collection("messages").add({
        sender: senderName.trim(),
        text: newMessage.trim(),
        secret: secretMode,
        openAt: capsuleDate ? new Date(capsuleDate) : null,
        timestamp: firebase.firestore.FieldValue.serverTimestamp(),
        color: `hsl(${Math.random() * 360}, 70%, 65%)`
      });
      setNewMessage("");
      setSecretMode(false);
      setCapsuleDate("");
    } catch (e) {
      console.error(e);
      alert("Mesaj gitmedi.");
    } finally {
      setSending(false);
    }
  }

  return (
    <div className="space-y-5">
      {/* ✅ Form: mobilde kolon, taşma yok */}
      <div className="rounded-3xl p-5 border border-white/12 bg-white/5 overflow-hidden">
        <SectionTitle title="Duvar" />
        <div className="grid gap-3">
          <input
            value={senderName}
            onChange={(e) => setSenderName(e.target.value)}
            placeholder="Adın"
            className="w-full min-w-0 rounded-2xl bg-black/20 border border-white/15 text-white px-4 py-3 outline-none focus:border-white/30"
          />

          <textarea
            value={newMessage}
            onChange={(e) => setNewMessage(e.target.value)}
            rows={5}
            placeholder="Mesaj…"
            className="w-full min-w-0 rounded-2xl bg-black/20 border border-white/15 text-white px-4 py-3 outline-none focus:border-white/30 resize-none"
          />

          <div className="flex items-center justify-between gap-3">
            <label className="text-white/80 text-sm flex items-center gap-2">
              <input type="checkbox" checked={secretMode} onChange={(e) => setSecretMode(e.target.checked)} />
              gizli
            </label>
            <Chip className="shrink-0">{newMessage.length}</Chip>
          </div>

          {/* ✅ Tarih + buton: mobilde alt alta, sm'de yan yana */}
          <div className="grid grid-cols-1 sm:grid-cols-[1fr_auto] gap-3">
            <input
              type="datetime-local"
              value={capsuleDate}
              onChange={(e) => setCapsuleDate(e.target.value)}
              className="w-full min-w-0 rounded-2xl bg-black/20 border border-white/15 text-white px-4 py-3 outline-none focus:border-white/30"
            />
            <Button onClick={send} disabled={sending} className="w-full sm:w-auto">
              {sending ? "…" : "Gönder"}
            </Button>
          </div>
        </div>
      </div>

      {/* ✅ Liste: break-words + overflow-hidden ile sağa taşma yok */}
      <div className="rounded-3xl p-5 border border-white/12 bg-white/5 overflow-hidden">
        <SectionTitle title="Mesajlar" right={<Chip>{messages.length}</Chip>} />
        <div className="grid gap-3">
          {messages.map((m) => {
            const openAt = m.openAt?.toDate ? m.openAt.toDate() : m.openAt ? new Date(m.openAt) : null;
            const locked = openAt && openAt > now;
            return (
              <div key={m.id} className="rounded-3xl p-4 bg-black/15 border border-white/10 overflow-hidden">
                <div className="flex items-center justify-between gap-2">
                  <div className="text-white font-bold min-w-0 break-words">{m.sender}</div>
                  {locked ? <Chip className="shrink-0">⏳ kapsül</Chip> : <Chip className="shrink-0">💬</Chip>}
                </div>

                {locked ? (
                  <div className="mt-3 text-white/60 text-sm break-words">
                    Bu mesaj {openAt.toLocaleString("tr-TR", { timeZone: TZ })} tarihinde açılacak.
                  </div>
                ) : (
                  <div className="mt-3 text-white/80 text-sm whitespace-pre-wrap leading-relaxed break-words overflow-hidden">
                    {m.secret ? <SecretHold>{m.text}</SecretHold> : m.text}
                  </div>
                )}
              </div>
            );
          })}
          {messages.length === 0 && <div className="text-white/60">Henüz yok.</div>}
        </div>
      </div>
    </div>
  );
}

/* -------------------- Tabs + App -------------------- */
function Tab({ active, onClick, label, icon }) {
  return (
    <button
      onClick={onClick}
      className={
        "rounded-2xl px-2 py-3 text-center transition border " +
        (active ? "bg-white text-black border-white" : "bg-white/5 text-white border-white/10 hover:bg-white/10")
      }
    >
      <div className="text-base leading-none">{icon}</div>
      <div className="text-[11px] font-semibold mt-1 tracking-tight">{label}</div>
    </button>
  );
}

function App() {
  const [view, setView] = useState("tonight");
  const [me, setMe] = useState(localStorage.getItem("slx_me") || "");
  const [partner, setPartner] = useState(localStorage.getItem("slx_partner") || "");
  const [vapidKey, setVapidKey] = useState(localStorage.getItem("slx_vapid") || "");

  useEffect(() => {
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    }
  }, []);

  const page = useMemo(() => {
    if (view === "tonight") return <Tonight db={db} me={me} partner={partner} />;
    if (view === "archive") return <Archive db={db} />;
    if (view === "capsules") return <Capsules db={db} me={me} />;
    if (view === "wall") return <LegacyWall />;
    return <Settings db={db} me={me} setMe={setMe} partner={partner} setPartner={setPartner} vapidKey={vapidKey} setVapidKey={setVapidKey} />;
  }, [view, me, partner, vapidKey]);

  return (
    <div className="min-h-screen bg-[#0b0b10] relative overflow-x-hidden">
      <FilmGrain />
      <div className="absolute inset-0 bg-[radial-gradient(circle_at_top,rgba(244,143,177,0.25),transparent_55%),radial-gradient(circle_at_bottom,rgba(124,58,237,0.22),transparent_55%)]" />

      <div className="relative z-10 max-w-3xl mx-auto px-4 pb-28 pt-6">
        <header className="flex items-center justify-between mb-5">
          <div className="min-w-0">
            <div className="text-white/60 text-xs tracking-widest uppercase">SLX</div>
            <div className="text-white text-2xl font-black leading-none">Gece Günlüğü</div>
          </div>
          <Chip className="hidden sm:inline-flex shrink-0">💞 birlikte</Chip>
        </header>

        {page}
      </div>

      <nav className="fixed bottom-0 left-0 right-0 z-20">
        <div className="max-w-3xl mx-auto px-4 pb-4">
          <div className="rounded-3xl border border-white/12 bg-black/35 backdrop-blur-xl shadow-2xl shadow-black/40 p-2 grid grid-cols-5 gap-2 overflow-hidden">
            <Tab active={view === "tonight"} onClick={() => setView("tonight")} label="Tonight" icon="🌙" />
            <Tab active={view === "archive"} onClick={() => setView("archive")} label="Arşiv" icon="🗓️" />
            <Tab active={view === "capsules"} onClick={() => setView("capsules")} label="Kapsül" icon="⏳" />
            <Tab active={view === "wall"} onClick={() => setView("wall")} label="Duvar" icon="💬" />
            <Tab active={view === "settings"} onClick={() => setView("settings")} label="Ayar" icon="⚙️" />
          </div>
        </div>
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
